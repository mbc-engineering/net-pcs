name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: NET

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: NuGet packages cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NET/**/*.csproj', 'NET/Directory.Build.props', 'NET/.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET local tools (Cake)
        run: dotnet tool restore

      - name: Run Cake build (Build + Test)
        run: .\build.ps1 -Target Test --x86=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresults
          path: |
            NET/testresult/**
            NET/testresultx86/**
          if-no-files-found: ignore

      - name: Upload NuGet packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            NET/**/bin/Release/**/*.nupkg
            NET/**/bin/Release/**/*.snupkg
          if-no-files-found: warn
